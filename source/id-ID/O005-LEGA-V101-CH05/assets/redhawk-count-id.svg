<svg xmlns="http://www.w3.org/2000/svg" width="300" height="213" viewBox="0 0 300 213" role="img" aria-labelledby="redhawk-count-title redhawk-count-desc">
  <title id="redhawk-count-title">Jumlah elang ekor-merah menurut tahun</title>
  <desc id="redhawk-count-desc">Grafik garis jumlah burung dari tahun 0 hingga 100. Jumlahnya rendah pada beberapa dasawarsa pertama, kemudian meningkat tajam hingga sekitar 60.000 dengan fluktuasi tahunan. Data dan geometri grafik dipertahankan persis dari raster sumber; hanya label sumbu yang dialihbahasakan.</desc>
  <image href="data:image/png;base64," x="0" y="0" width="300" height="213" preserveAspectRatio="none"/>
  <g aria-hidden="true" fill="#000" font-family="Arial, Helvetica, sans-serif">
    <rect x="0" y="72" width="17" height="76" fill="#fff"/>
    <text x="9" y="110" font-size="7" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 9 110)">Jumlah burung</text>
    <rect x="128" y="197" width="44" height="16" fill="#fff"/>
    <text x="150" y="207" font-size="7" text-anchor="middle">Tahun</text>
  </g>
</svg>
