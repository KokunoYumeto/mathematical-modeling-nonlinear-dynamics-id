<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" role="img" aria-labelledby="stability-title stability-desc">
  <title id="stability-title">Kestabilan titik tetap sistem satu dimensi</title>
  <desc id="stability-desc">Grafik fungsi y sama dengan f dari x dengan tiga titik tetap pada sumbu x. Titik tengah stabil, sedangkan dua titik luar takstabil. Kurva, sumbu, titik, dan panah dipertahankan persis dari raster sumber; hanya label kestabilan yang dialihbahasakan.</desc>
  <image href="data:image/png;base64," x="0" y="0" width="300" height="220" preserveAspectRatio="none"/>
  <g aria-hidden="true" fill="#000" font-family="Times New Roman, Times, serif" font-size="12">
    <rect x="170" y="112" width="39" height="18" fill="#fff"/>
    <text x="189.5" y="125" text-anchor="middle">stabil</text>
    <rect x="56" y="173" width="53" height="17" fill="#fff"/>
    <text x="82.5" y="186" text-anchor="middle">takstabil</text>
    <rect x="234" y="173" width="54" height="17" fill="#fff"/>
    <text x="261" y="186" text-anchor="middle">takstabil</text>
  </g>
</svg>
